ário abstrato reúne interações comuns; não é um novo papel de acesso.</text><text x="17" y="1150.361" fill="#000" font-size="14" textLength="533.853">Revisão pedagógica exige papel Professor; administrador mantém/publica rascunhos.</text><text x="17" y="1167.971" fill="#000" font-size="14" textLength="451.336">Autenticação é pré-condição dos fluxos restritos, sem «include» artificial.</text><text x="17" y="1185.58" fill="#000" font-size="14" textLength="519.066">UC-005 abrange configuração, respostas, prazo, encerramento e correção objetiva.</text><text x="17" y="1203.189" fill="#000" font-size="14" textLength="454.446">As associações representam permissões propostas, sujeitas à validação.</text></g><?plantuml-src TLNDZjD84BxxAMhdp31n9ioFG2EDihCt42BYbal5NVOqsDscknrW06aVWWS0SLZDOKyZBbpz9liaMsKdZhETlIJsv_hhhxwg_grsM5G89NwqJG1VKK23IKbvW631wU8sWDAEig2jIVnRRMfqM86_HMNVQrD0ZgMdqPSQixTOq29yB0d44KrHZWqKvTYKuGzhmWki21Pe_8ASpW_RBFGTGJeRVSGiMDV7n_VaRKL9q87V5je7ujCeWklQQWjeuUR5zUytyC-VNs6EtdhvrdYxDC-jej92Par6EZHOGkriRJsV-ZCyJ_bdCZj9qvFfP7gMT1dXwBLlskzEsoD03_o2_0pFdk7A1uV1Nbrj36zyQ1IQG9ltbyxcvBrrc_UvjKwHOGQtoBMgjD4IHh0XzEVZur6mFNWNSmyUXzxxi9zXw0iS_IzfH_0f0IQBClHiztf-F9caItFT1391P-Y0W9Wzv_ZHSotjZmqpSpRyhsiwMveRfGFRrkHoBNot3_N0vfmj8f_JfPcZGgdQIQi23iQdKMrJDhR6isowqchoxnhj-VbTGpwqFyaFrKqZPyxqYdnjZQAjmmyBsYYzrehLCRZ6UMVZl0MkcFCWmggO9YPxy8oEDtaYIR7KTqAWhfgIpI5prh1lrwZ1zqdaUpREUiizR1-Spgpqn0SCxTzUUhGxybaKuNnfNg9ZAyrZ1OeLe7tMT6s4skvO64ASHo4kU8v4ciAtetN7zfQ1NUgBoEzoNBoGd8agoGCMZWf-tZbVHgAOi0O7CH_eRZg9ND9-tiLyUyYnGopMwNwEJdfUH8LrUwztdjFaop1cF6IzylS1blKmmbleD89OaX5qm2gEnTA8eBCOEa-6XR7B646p63hWU96CjimMl4psDipEzX3CBJe8fuVXALz81Ha5Ank2hRXRsqqCsztBycj_6M8niHgn_KlwApFO6FyKZ4YwlOUc0cFNLhf8fImypEHWZpdWAr5lftnIMBGF1KiIw8CkQ6CziF0KSA_6YcbkxwkJkbcLukIG1MPkhPUmmxBaYleQUElT7xEUbEuXrZhaPVE1_tW0GZSvZtYTLdonQ9ELZQAhAv0vpNbIiPIe_VBWiplUuIJgp7NHk3x98uaZ5nbo7BxUxnZPh6dPIB8XCkkOhYwzNRsXeDVO5SlpnoVaB1l-7DKSIzPO9KkxqltSR6zAIU2RDtnzyZIqts3DgqprHJnEk5rzq_u5?></g></svg>